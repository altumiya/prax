<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Clock & Background Color Changer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #212121;
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: background-color 0.5s ease;
    }

    #title {
      cursor: pointer;
      font-size: 2rem;
      user-select: none;
      transition: color 0.5s ease;
    }

    #currentTime {
      font-size: 1.2rem;
      font-family: monospace;
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
    }

    .btn-container {
      display: flex;
      gap: 15px;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    #start {
      background-color: #2e7d32;
      color: #ffffff;
    }

    #start:hover {
      background-color: #1b5e20;
    }

    #stop {
      background-color: #d32f2f;
      color: #ffffff;
    }

    #stop:hover {
      background-color: #b71c1c;
    }
  </style>
</head>
<body>

  <h1 id="title">Click Me or Press Start</h1>
  <h4 id="title2">this is example of changing background color with text color by using DOM.<br/> if want to use class instaed of id take use of foreach loop otherwise id is unique so have to be called everytime!!</h4>

  <div id="currentTime"></div>

  <div class="btn-container">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
  </div>

  <script>
    // Live clock updated every second
    function showTime() {
      document.getElementById('currentTime').innerHTML = new Date().toUTCString();
    }
    showTime();
    setInterval(showTime, 1000);

    // Random hex color generator
    const randomcolor = function () {
      const hex = "0123456789ABCDEF";
      let color = "#";
      for (let i = 0; i < 6; i++) {
        color += hex[Math.floor(Math.random() * 16)];
      }
      return color;
    };
    console.log(randomcolor());

    // Color interval controls
    let intervalId = null;

    const startchaingingcolor = function () {
      if (!intervalId) {
        intervalId = setInterval(function () {
          document.body.style.backgroundColor = randomcolor();
          document.querySelector('#title').style.color = randomcolor();
          document.querySelector('#title2').style.color = randomcolor();

        }, 1000);
      }
    };

    const stopchaingingcolor = function () {
      clearInterval(intervalId);
      intervalId = null;
    };

    // Event listeners
    document.querySelector('#start').addEventListener('click', startchaingingcolor);
    document.querySelector('#stop').addEventListener('click', stopchaingingcolor);
    document.querySelector('#title').addEventListener('click', startchaingingcolor);
    document.querySelector('#title2').addEventListener('click', startchaingingcolor);

  </script>

</body>
</html>

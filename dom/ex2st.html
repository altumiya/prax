<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClearTimeout Demo</title>
  <style>
    body {
      background-color: #212121;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 24px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      background-color: #e53935;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #c62828;
    }
  </style>
</head>
<body>

  <h1>Initial Heading</h1>
  <button id="stop">Stop</button>

  <script>
    const sayaltaf = function () {
      console.log("altaf");
    };

    const textchnage = function () {
      document.querySelector('h1').innerHTML = "altaf hussain shaikh";
    };

    // Starts a 2-second timer to update the text
    const change = setTimeout(textchnage, 2000);

    // Stops the timer if the button is clicked before 2 seconds elapse
    document.querySelector("#stop").addEventListener('click', function () {
      clearTimeout(change);
      console.log("stop");
    });
  </script>

</body>
</html>
